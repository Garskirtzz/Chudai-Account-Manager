<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Chudai Account Manager</title>
<desc>
  Rancangan pemakai, apa adanya. Satu perubahan saja: dua rect latar yang
  memenuhi kanvas (#121215 lalu putih menimpanya) dibuang, sehingga latarnya
  transparan. Latar padat membuat ikon terlihat seperti stiker tempelan di
  taskbar, bukan bentuk yang berdiri sendiri.

  PENTING kalau berkas ini diedit lagi: JANGAN memakai tanda hubung ganda di
  dalam komentar XML. SVG itu XML, dan komentar XML melarangnya. Berkas jadi
  tidak sah, WebView gagal mem-parsing, dan yang tampil adalah ikon gambar
  rusak. Itu sudah pernah terjadi di berkas ini. Blok teks ini memakai
  elemen desc, bukan komentar, justru supaya tidak bisa terulang.
</desc>
