[package]
name = "ChudaiAccountManager"
version = "0.14.0"
edition = "2021"
description = "Chudai Account Manager - pengelola banyak akun Roblox dengan multi-instance"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
urlencoding = "2"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"
argon2 = "0.5"
aes-gcm = "0.10"

webview2-com = "=0.38.2"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_Foundation"] }
windows-future = "=0.2.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
